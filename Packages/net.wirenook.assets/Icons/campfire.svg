<?xml version="1.0" encoding="UTF-8"?>
<!-- wirenook radial-menu icon. Grid, stroke and colour rules: README.md beside this file. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>campfire</title>
  <defs>
    <style>
      .body, .soft, .glow, .warm { stroke: #271452; stroke-width: 8; stroke-linejoin: round; stroke-linecap: round; }
      .body { fill: #d7fbff; }
      .soft { fill: #b9a8ff; }
      .glow { fill: #ff00e6; }
      .warm { fill: #ff6600; }
      .mark { fill: none; stroke: #271452; stroke-width: 8; stroke-linejoin: round; stroke-linecap: round; }
      .dot { fill: #271452; }
      .edge, .core { fill: none; stroke-linejoin: round; stroke-linecap: round; }
      .edge { stroke: #271452; stroke-width: 28; }
      .core { stroke: #d7fbff; stroke-width: 12; }
      .limb.edge { stroke-width: 38; }
      .limb.core { stroke-width: 22; }
      .core.soft { stroke: #b9a8ff; }
      .core.glow { stroke: #ff00e6; }
      .core.warm { stroke: #ff6600; }
      .solid.edge { fill: #271452; stroke-width: 16; }
      .solid.core { fill: #d7fbff; stroke: none; }
      .solid.core.soft { fill: #b9a8ff; }
      .solid.core.glow { fill: #ff00e6; }
      .solid.core.warm { fill: #ff6600; }
    </style>
    <!-- The hard violet extrusion every icon shares: the silhouette swept 8 px down-right. -->
    <filter id="extrude" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feFlood flood-color="#6d2c95"/>
      <feComposite in2="SourceAlpha" operator="in" result="silhouette"/>
      <feOffset in="silhouette" dx="4" dy="4" result="near"/>
      <feOffset in="silhouette" dx="8" dy="8" result="far"/>
      <feMerge>
        <feMergeNode in="far"/>
        <feMergeNode in="near"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#extrude)">
    <path class="warm" d="M 122,22 Q 180,80 168,122 Q 160,160 122,160 Q 84,160 76,122 Q 70,92 100,68 Q 102,92 116,92 Q 106,56 122,22 Z"/>
    <path class="body" d="M 122,98 Q 144,122 138,140 Q 134,152 122,152 Q 110,152 106,140 Q 100,122 122,98 Z"/>
    <path class="soft" d="M 36,168 L 196,204 L 204,222 L 44,186 Z"/>
    <path class="soft" d="M 208,168 L 48,204 L 40,222 L 200,186 Z"/>
  </g>
</svg>
